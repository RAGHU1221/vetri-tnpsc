name: Build Vetri TNPSC APK

# Runs on EVERY push to main (any file, anywhere in the repo), or manually via the Actions tab ("Run workflow" button)
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files (safe on an existing project — only adds the missing android/ folder, does not touch lib/ or pubspec.yaml)
        run: flutter create --platforms=android --org com.vetritnpsc .

      - name: Patch MainActivity for biometric auth (local_auth needs FlutterFragmentActivity)
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt")
          echo "Patching $MAIN_ACT"
          {
            echo "package com.vetritnpsc.app"
            echo ""
            echo "import io.flutter.embedding.android.FlutterFragmentActivity"
            echo ""
            echo "class MainActivity : FlutterFragmentActivity()"
          } > "$MAIN_ACT"
          cat "$MAIN_ACT"

      - name: Patch AndroidManifest.xml for notification permissions (Phase 4 daily quiz reminder)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>#' "$MANIFEST"
          head -10 "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking — surfaces warnings without failing the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetri-tnpsc-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "வெற்றி TNPSC — Build #${{ github.run_number }}"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `app-release.apk` below and install on Android
            (enable "install from unknown sources" if prompted).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
