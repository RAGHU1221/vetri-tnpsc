name: Build Vetri TNPSC APK

# Runs on EVERY push to main (any file, anywhere in the repo), or manually via the Actions tab ("Run workflow" button)
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files (safe on an existing project — only adds the missing android/ folder, does not touch lib/ or pubspec.yaml)
        run: flutter create --platforms=android --org com.vetritnpsc .

      - name: Skip MainActivity patch — plain FlutterActivity is correct (local_auth/biometric not used in this app; FlutterFragmentActivity requires a Theme.AppCompat theme which this project doesn't have, and caused a crash-on-launch IllegalStateException)
        run: |
          MAIN_ACT=$(find android/app/src/main -name "MainActivity.kt")
          echo "Leaving default FlutterActivity as generated by 'flutter create':"
          cat "$MAIN_ACT"

      - name: Patch AndroidManifest.xml for notification permissions (Phase 4 daily quiz reminder) and app name
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="Vetri TNPSC"#' "$MANIFEST"
          head -10 "$MANIFEST"

      - name: Enable core library desugaring (required by flutter_local_notifications)
        run: |
          python3 - << 'PYEOF'
          import re, glob

          candidates = glob.glob('android/app/build.gradle.kts') + glob.glob('android/app/build.gradle')
          path = candidates[0]
          kotlin_dsl = path.endswith('.kts')
          print(f"Patching {path} (kotlin_dsl={kotlin_dsl})")
          src = open(path).read()

          if kotlin_dsl:
              if 'isCoreLibraryDesugaringEnabled' not in src:
                  src = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        isCoreLibraryDesugaringEnabled = true',
                      src, count=1)
              if 'coreLibraryDesugaring(' not in src:
                  if re.search(r'\ndependencies\s*\{', src):
                      src = re.sub(
                          r'(\ndependencies\s*\{)',
                          r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          src, count=1)
                  else:
                      src += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              if 'coreLibraryDesugaringEnabled' not in src:
                  src = re.sub(
                      r'(compileOptions\s*\{)',
                      r'\1\n        coreLibraryDesugaringEnabled true',
                      src, count=1)
              if 'coreLibraryDesugaring ' not in src:
                  if re.search(r'\ndependencies\s*\{', src):
                      src = re.sub(
                          r'(\ndependencies\s*\{)',
                          r"\1\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                          src, count=1)
                  else:
                      src += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"

          open(path, 'w').write(src)
          print("--- Result ---")
          print(src)
          PYEOF

      - name: Disable R8 minification for release (safety-first — full-mode R8 shrinking was
              stripping/renaming classes needed by plugins like flutter_local_notifications at
              runtime, causing a crash-on-launch with no compile-time warning. Trade a slightly
              larger APK for a build that reliably starts; can be re-enabled later with proper
              proguard keep rules once stable.)
        run: |
          python3 - << 'PYEOF'
          import re, glob

          candidates = glob.glob('android/app/build.gradle.kts') + glob.glob('android/app/build.gradle')
          path = candidates[0]
          kotlin_dsl = path.endswith('.kts')
          src = open(path).read()

          if kotlin_dsl:
              src = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', src)
              src = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', src)
              if 'isMinifyEnabled' not in src:
                  src = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            isMinifyEnabled = false',
                      src, count=1)
          else:
              src = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', src)
              src = re.sub(r'shrinkResources\s+true', 'shrinkResources false', src)
              if 'minifyEnabled' not in src:
                  src = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            minifyEnabled false',
                      src, count=1)

          open(path, 'w').write(src)
          print("--- Result ---")
          print(src)
          PYEOF

      - name: Set up permanent release signing (fixes "App not installed" —
              every previous build used a fresh random debug key since CI
              runners don't persist ~/.android/debug.keystore between runs,
              so each APK had a different signature and Android refused to
              install over the previously-installed one. This keystore is
              the same on every build from now on.)
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > android/app/vetri-release.keystore
          python3 - << 'PYEOF'
          import glob

          candidates = glob.glob('android/app/build.gradle.kts') + glob.glob('android/app/build.gradle')
          path = candidates[0]
          kotlin_dsl = path.endswith('.kts')
          src = open(path).read()

          if kotlin_dsl:
              lines = ['android {', '    signingConfigs {', '        create("release") {',
                       '            storeFile = file("vetri-release.keystore")',
                       '            storePassword = "VetriTNPSC2026"',
                       '            keyAlias = "vetritnpsc"',
                       '            keyPassword = "VetriTNPSC2026"',
                       '        }', '    }', '']
              signing_block = chr(10).join(lines)
              src = src.replace("android {" + chr(10), signing_block, 1)
              src = src.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")')
          else:
              lines = ['android {', '    signingConfigs {', '        release {',
                       '            storeFile file("vetri-release.keystore")',
                       '            storePassword "VetriTNPSC2026"',
                       '            keyAlias "vetritnpsc"',
                       '            keyPassword "VetriTNPSC2026"',
                       '        }', '    }', '']
              signing_block = chr(10).join(lines)
              src = src.replace("android {" + chr(10), signing_block, 1)
              src = src.replace('signingConfig signingConfigs.debug',
                                 'signingConfig signingConfigs.release')

          open(path, 'w').write(src)
          print("--- Result ---")
          print(src)
          PYEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking — surfaces warnings without failing the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetri-tnpsc-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "வெற்றி TNPSC — Build #${{ github.run_number }}"
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            Automated build from commit ${{ github.sha }}.
            Download `app-release.apk` below and install on Android
            (enable "install from unknown sources" if prompted).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
