name: vetri_tnpsc
description: TNPSC exam preparation app - Tamil & English
publish_to: 'none'
version: 0.1.0
repository: https://github.com/RAGHU1221/vetri-tnpsc

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/questions_seed.json
    - assets/data/exam_guides.json
